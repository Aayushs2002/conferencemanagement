name: Deploy Laravel to VPS

on:
  push:
    branches:
      - master  # Production branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP (needed for composer commands locally)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl

      # 3. Create a tar archive excluding unnecessary files
      - name: Create deploy archive
        run: |
          tar czf deploy.tar.gz . \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=storage/logs \
            --exclude=tests

      # 4. Upload the archive to the VPS
      - name: Upload archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/var/www/medconalert.com"
          overwrite: true

      # 5. Run SSH commands to extract and deploy
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/medconalert.com

            # Extract archive and remove it
            tar xzf deploy.tar.gz
            rm deploy.tar.gz

            # Ensure storage and bootstrap/cache directories exist and have correct permissions
            mkdir -p storage/logs
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Install PHP dependencies on VPS (production only)
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run database migrations
            php artisan migrate --force

            # Create storage symlink if using public storage
            php artisan storage:link || true

            # Cache config, routes, views
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restart PHP-FPM and reload Apache
            sudo systemctl restart php8.3-fpm
            sudo systemctl reload apache2
