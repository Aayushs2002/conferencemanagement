name: Deploy Laravel to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, pdo_pgsql

      - name: Install Composer dependencies (without scripts)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Prepare VPS permissions
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo chown -R $USER:$USER /var/www/medconalert.com

      - name: Sync changed files to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/app/public/*' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/medconalert.com/

          rm ~/.ssh/deploy_key

      - name: Run Laravel tasks on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/medconalert.com

            echo "🧹 Clearing caches..."
            sudo -u www-data php artisan optimize:clear

            echo "🗑️ Removing old compiled cache files..."
            sudo rm -f bootstrap/cache/*.php

            echo "📦 Dump autoload..."
            sudo -u www-data composer dump-autoload --optimize

            echo "🗄️ Running migrations..."
            sudo -u www-data php artisan migrate --force

            echo "🔧 Fixing permissions..."
            sudo chown -R www-data:www-data /var/www/medconalert.com
            sudo find /var/www/medconalert.com -type f -exec chmod 644 {} \;
            sudo find /var/www/medconalert.com -type d -exec chmod 755 {} \;
            sudo chmod -R 775 storage bootstrap/cache

            echo "🔗 Ensuring storage link..."
            sudo -u www-data php artisan storage:link 2>/dev/null || true

            echo "♻️ Restarting services..."
            sudo systemctl restart php8.3-fpm || true
            sudo systemctl reload apache2

            echo "✅ Deployment successful!"
