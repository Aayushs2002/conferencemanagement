name: Deploy Laravel to VPS

on:
  push:
    branches:
      - master # Change to your production branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, pdo_pgsql

      # 3. Install Composer dependencies on GitHub runner (skip scripts to avoid DB errors)
      - name: Install dependencies on runner
        run: composer install --no-dev --optimize-autoloader --no-scripts

      # 4. Deploy using rsync (more reliable than scp-action)
      - name: Deploy to VPS with rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.env' --exclude='storage/framework/sessions/*' --exclude='storage/logs/*'
          path: ./
          remote_path: /var/www/medconalert.com/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # 5. Run Composer and Artisan commands on VPS
      - name: Setup Laravel on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/medconalert.com

            # Install Composer dependencies with scripts (package discovery)
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader

            # Run database migrations
            php artisan migrate --force

            # Clear all caches
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            # Cache configs, routes, views
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Set permissions
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Restart PHP-FPM and reload Apache
            sudo systemctl restart php8.3-fpm
            sudo systemctl reload apache2