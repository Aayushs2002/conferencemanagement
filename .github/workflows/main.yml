name: Deploy Laravel to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, pdo_pgsql

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare for deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Change ownership to current user temporarily
            sudo chown -R $USER:$USER /var/www/medconalert.com

      - name: Sync only changed files
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Sync files (only changed ones)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/app/public/*' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/medconalert.com/
          
          # Cleanup
          rm ~/.ssh/deploy_key

      - name: Run Laravel commands
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/medconalert.com
            
            echo "🗄️ Running migrations..."
            php artisan migrate --force
            
            echo "🧹 Clearing caches..."
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            
            echo "⚡ Building caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🔒 Setting permissions..."
            sudo chown -R www-data:www-data /var/www/medconalert.com
            sudo chmod -R 755 /var/www/medconalert.com
            sudo chmod -R 775 /var/www/medconalert.com/storage
            sudo chmod -R 775 /var/www/medconalert.com/bootstrap/cache
            
            echo "♻️ Restarting services..."
            sudo systemctl restart php8.3-fpm
            sudo systemctl reload apache2
            
            echo "✅ Deployment completed successfully!"